services:
  - type: web
    name: resumeforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: USE_REDIS
        value: "false"
      - key: SPACY_MODEL
        value: en_core_web_md
      - key: SENTENCE_TRANSFORMER_MODEL
        value: models/all-MiniLM-L6-v2
      - key: NLTK_DATA
        value: ./nltk_data
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
