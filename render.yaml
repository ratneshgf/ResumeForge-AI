services:
  # Backend API
  - type: web
    name: resumeforge-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MAX_RETRIES
        value: 5
      - key: AI_TIMEOUT_SECONDS
        value: 90
      - key: AI_TEMPERATURE
        value: 0.7
      - key: USE_REDIS
        value: false
      - key: MAX_UPLOAD_MB
        value: 5
      - key: FILE_TTL_MINUTES
        value: 60
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
